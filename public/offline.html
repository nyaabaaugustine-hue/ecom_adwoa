<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Adwoa's Beauty</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
      text-align: center;
      padding: 2rem;
    }
    .icon {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #ec4899, #f59e0b);
      border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 2.5rem;
    }
    h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
    p  { color: #94a3b8; font-size: 1rem; margin-bottom: 1.5rem; max-width: 320px; }
    a  {
      display: inline-block;
      background: linear-gradient(135deg, #ec4899, #f59e0b);
      color: #fff; font-weight: 600; text-decoration: none;
      padding: 0.75rem 2rem; border-radius: 9999px;
      transition: opacity .2s;
    }
    a:hover { opacity: .85; }
  </style>
</head>
<body>
  <div class="icon">🛍️</div>
  <h1>You're Offline</h1>
  <p>No internet connection. Please check your network and try again — your cart is saved!</p>
  <a href="/" onclick="window.location.reload(); return false;">Try Again</a>
</body>
</html>
